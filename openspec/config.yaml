schema: spec-driven

context: |
  PMAP frontend: React 19, Vite 8, TypeScript 7, TanStack Query, React Router, openapi-fetch.
  UI: Tailwind CSS v4 + shadcn/ui, lucide-react icons, Recharts, TanStack Table v8 (NOT v9, its API differs).
  UI language is English. Dates are ISO in URLs and shown as locale dates. Prices in PLN, areas in m2.
  Filter state lives in the URL search params. The backend has no total count: lists use keyset paging
  (after_id = last row id, after_value = last row's sort value as a string, omitted when null).
  The user role comes from the JWT `role` claim and only controls what the UI shows; the gateway enforces access.
  Public reads need no token (transactions, territories, analytics); /exports and /admin need a token.
  Query parameters are strict on the backend (unknown ones give 422): never send sort/limit/paging to exports or analytics.
  The gateway throttles at 20 requests/s: debounce text inputs and avoid request bursts.
  Every screen has loading, empty and error states. Components are keyboard accessible and responsive down to 360px.
  Tests: Vitest + Testing Library; HTTP mocked through src/test/http.ts. Do not edit src/api/schema.d.ts by hand.

rules:
  tasks:
    - Each task ends with a passing `npm run build`, `npm run lint` and `npm test`.
    - New logic comes with tests; user-visible behaviour is covered by Testing Library tests.
